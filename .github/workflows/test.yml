name: Test Task Manager

on:
    push:
    pull_request:

jobs:
    test:

        runs-on: ubuntu-latest

        steps:

            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Install dependencies
              working-directory: backend
              run: npm ci

            - name: Run ESLint
              working-directory: backend
              run: npx eslint .

            - name: Run tests
              working-directory: backend
              run: npm test